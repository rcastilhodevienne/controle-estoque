<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque Inteligente</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📦 Controle de Estoque</h1>

        <div class="card">
            <h2>Cadastrar Produto</h2>
            <div class="form-group">
                <input type="text" id="nome" placeholder="Nome do produto">
                <input type="number" id="quantidade" placeholder="Qtd. Inicial">
                <input type="number" id="vendasPorDia" placeholder="Média de vendas por dia">
                <button onclick="adicionarProduto()">Salvar Produto</button>
            </div>
        </div>

        <div class="card">
            <h2>Estoque Atual</h2>
            <div id="lista-produtos"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
